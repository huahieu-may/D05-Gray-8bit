name: D05 - RTL Simulation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download source code
        uses: actions/checkout@v6

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run D05 testbench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          iverilog -V > build/ci/tool_versions.txt 2>&1
          iverilog -g2012 -s d05_core_tb \
            -o build/ci/sim.vvp \
            04_IMPLEMENTATION/rtl/d05_core.sv \
            05_VERIFICATION/testbench/d05_core_tb.sv
          cd build/ci
          vvp sim.vvp | tee simulation.log

      - name: Save simulation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: D05-simulation-results
          path: build/ci/
          retention-days: 14
